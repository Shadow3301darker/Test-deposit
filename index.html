<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>VEIL // GGUF Web Test v3</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
body{margin:0;background:#090b10;color:#eee}main{max-width:760px;margin:auto;padding:24px 18px 40px}
h1{margin-bottom:4px}.muted{color:#9aa1ad}.card{background:#11151d;border:1px solid #242a35;border-radius:16px;padding:16px;margin:14px 0}
button,input{font:inherit}button{border:0;border-radius:12px;padding:11px 15px;background:#e8eaf0;color:#090b10;font-weight:700}
button:disabled{opacity:.45}input[type=file]{width:100%;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;background:#090b10;padding:12px;border-radius:12px;min-height:70px}
textarea{width:100%;box-sizing:border-box;min-height:100px;background:#090b10;color:#eee;border:1px solid #303744;border-radius:12px;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ok{color:#72e6a1}.bad{color:#ff7d86}.warn{color:#ffd166}.small{font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>VEIL // GGUF Web Test v3</h1>
<div class="muted">Correct wllama v1 raw-completion call. No chat template.</div>

<section class="card">
<h2>1. WebGPU</h2><pre id="gpu">Checking…</pre>
</section>

<section class="card">
<h2>2. Load GGUF</h2>
<p class="small muted">Choose the tiny GGUF first. The file is read locally by this page.</p>
<input id="modelFile" type="file" accept=".gguf,application/octet-stream">
<div class="row"><button id="load" disabled>Load model</button><span id="fileInfo" class="small muted">No model selected.</span></div>
<pre id="modelStatus">Waiting.</pre>
</section>

<section class="card">
<h2>3. Raw inference</h2>
<textarea id="prompt">Hello. Say one short sentence.</textarea><br><br>
<button id="run" disabled>Generate</button>
<pre id="output">Model not loaded.</pre>
</section>
</main>

<script type="module">
const $=id=>document.getElementById(id);
let selectedFile=null,wllama=null;

async function checkGPU(){
 if(!navigator.gpu){$("gpu").innerHTML='<span class="bad">❌ WebGPU unavailable.</span>';return false}
 try{
  const adapter=await navigator.gpu.requestAdapter();
  if(!adapter)throw new Error("No adapter returned");
  $("gpu").innerHTML='<span class="ok">✅ WebGPU adapter found.</span>';
  return true;
 }catch(e){
  $("gpu").innerHTML='<span class="bad">❌ WebGPU failed: '+e.message+'</span>';
  return false;
 }
}
const gpuOK=await checkGPU();

$("modelFile").onchange=e=>{
 selectedFile=e.target.files?.[0]||null;
 if(!selectedFile)return;
 const gib=selectedFile.size/1024**3;
 $("fileInfo").textContent=`${selectedFile.name} — ${gib.toFixed(2)} GiB`;
 $("modelStatus").textContent="Ready to attempt loading.";
 $("load").disabled=!gpuOK;
};

$("load").onclick=async()=>{
 $("load").disabled=true;
 $("modelStatus").textContent="Loading runtime…";
 try{
  const mod=await import("https://cdn.jsdelivr.net/npm/@reeselevine/wllama-webgpu@1.0.0/esm/index.js");
  const WasmFromCDN=(await import("https://cdn.jsdelivr.net/npm/@reeselevine/wllama-webgpu@1.0.0/esm/wasm-from-cdn.js")).default;
  const Wllama=mod.Wllama;
  wllama=new Wllama(WasmFromCDN,{backend:"webgpu"});
  await wllama.loadModel([selectedFile],{
   n_ctx:1024,
   n_gpu_layers:-1,
   progressCallback:({loaded,total})=>{
    if(total)$("modelStatus").textContent=`Loading… ${Math.round(loaded/total*100)}%`;
   }
  });
  $("modelStatus").innerHTML='<span class="ok">✅ Model loaded locally.</span>';
  $("run").disabled=false;
 }catch(e){
  console.error(e);
  $("modelStatus").innerHTML='<span class="bad">❌ Load failed.</span>\n\n'+(e?.stack||e);
 }finally{$("load").disabled=false}
};

$("run").onclick=async()=>{
 if(!wllama)return;
 $("run").disabled=true;
 $("output").textContent="Generating…";
 try{
  const result=await wllama.createCompletion(
   $("prompt").value,
   {
    nPredict:80,
    sampling:{temp:0.7,top_k:40,top_p:0.9}
   }
  );
  $("output").textContent=typeof result==="string"
   ? result
   : (result?.choices?.[0]?.text ?? JSON.stringify(result,null,2));
 }catch(e){
  console.error(e);
  $("output").textContent="❌ Raw inference failed:\n\n"+(e?.message||e)+"\n\n"+(e?.stack||"");
 }finally{$("run").disabled=false}
};
</script>
</body>
</html>
